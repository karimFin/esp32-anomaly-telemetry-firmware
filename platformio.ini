[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -DMQTT_USE_TLS=0
  -DMQTT_TLS_INSECURE=1
  -DMQTT_BROKER_HOST=\"broker.hivemq.com\"
  -DMQTT_TOPIC=\"karimFin/esp32-edge-monitor-firmware/telemetry\"
  -DMQTT_USERNAME=\"\"
  -DMQTT_PASSWORD=\"\"
lib_deps =
  beegee-tokyo/DHT sensor library for ESPx@^1.19
  knolleary/PubSubClient@^2.8
